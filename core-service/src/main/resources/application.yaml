server:
  port: 8082

spring:
  application:
    name: core-service
  datasource:
    url: jdbc:postgresql://localhost:5432/corebank
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true

jwt:
  secret: super-secret-for-demo-only-change-in-prod
  expiration: 3600000

resilience4j:
  circuitbreaker:
    instances:
      homeService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      homeService:
        maxAttempts: 3
        waitDuration: 500

logging:
  level:
    com.corebank: DEBUG
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
